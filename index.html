<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Service Blueprint Senior</title>
<style>
  :root {
    --paper: #f5f8fc;
    --surface: #ffffff;
    --surface-2: #eaf0f7;
    --ink: #16324f;
    --ink-soft: #4d6a87;
    --line: #c9d6e4;
    --line-strong: #9db3c8;
    --accent: #2e6fbe;
    --accent-strong: #1d4e8c;
    --accent-tint: #e2edf9;
    --warm: #b96a1e;
    --warm-tint: #f6e6d3;
    --danger: #b6402e;
    --danger-tint: #f8e2dd;
    --good: #2f8f5b;
    --good-tint: #e0f0e7;
    --highlight: #7c4fd1;
    --highlight-tint: #efe6fb;
    --font-body: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --font-tech: ui-monospace, "Cascadia Code", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0f2740; --surface: #15304c; --surface-2: #1c3a5a;
      --ink: #e7f0fa; --ink-soft: #a9c2da;
      --line: #2e4f6e; --line-strong: #446f95;
      --accent: #7fb3e8; --accent-strong: #bcd9f5; --accent-tint: #1e3f5f;
      --warm: #e3a768; --warm-tint: #3a2c1a;
      --danger: #e0796a; --danger-tint: #3a231f;
      --good: #6fcb98; --good-tint: #1c3527;
      --highlight: #c3a4f0; --highlight-tint: #2f2447;
    }
  }
  :root[data-theme="dark"] {
    --paper: #0f2740; --surface: #15304c; --surface-2: #1c3a5a;
    --ink: #e7f0fa; --ink-soft: #a9c2da;
    --line: #2e4f6e; --line-strong: #446f95;
    --accent: #7fb3e8; --accent-strong: #bcd9f5; --accent-tint: #1e3f5f;
    --warm: #e3a768; --warm-tint: #3a2c1a;
    --danger: #e0796a; --danger-tint: #3a231f;
    --good: #6fcb98; --good-tint: #1c3527;
    --highlight: #c3a4f0; --highlight-tint: #2f2447;
  }
  :root[data-theme="light"] {
    --paper: #f5f8fc; --surface: #ffffff; --surface-2: #eaf0f7;
    --ink: #16324f; --ink-soft: #4d6a87;
    --line: #c9d6e4; --line-strong: #9db3c8;
    --accent: #2e6fbe; --accent-strong: #1d4e8c; --accent-tint: #e2edf9;
    --warm: #b96a1e; --warm-tint: #f6e6d3;
    --danger: #b6402e; --danger-tint: #f8e2dd;
    --good: #2f8f5b; --good-tint: #e0f0e7;
    --highlight: #7c4fd1; --highlight-tint: #efe6fb;
  }

  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
  button { font-family: inherit; font-size: 12.5px; cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: 0.55; }
  button:focus-visible, [contenteditable]:focus-visible, [contenteditable]:focus, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  a { color: var(--accent-strong); }

  /* The dropdown popup a <select> opens is rendered by the OS/browser, not by our theme â€”
     without this, its options fall back to light-on-light or dark-on-dark depending on the
     select's own (often muted/transparent) closed-state color. */
  select { color-scheme: light dark; }
  select option { color: var(--ink); background-color: var(--surface); }
  select option:checked, select option:hover { color: var(--ink); background-color: var(--surface-2); }

  .eyebrow { font-family: var(--font-tech); font-size: 10.5px; letter-spacing: 0.11em; text-transform: uppercase; color: var(--ink-soft); }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
    border-radius: 6px; padding: 7px 12px; font-weight: 600; white-space: nowrap;
  }
  .btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-strong); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover:not(:disabled) { background: var(--accent-strong); border-color: var(--accent-strong); color: #fff; }
  .btn.ghost { border-color: transparent; background: transparent; }
  .btn.ghost:hover:not(:disabled) { background: var(--surface-2); }
  .btn.danger:hover:not(:disabled) { border-color: var(--danger); color: var(--danger); }
  .btn.small { padding: 4px 9px; font-size: 11.5px; }
  .divider-v { width: 1px; align-self: stretch; background: var(--line); margin: 0 2px; }
  .spacer { flex: 1; }
  .icon-btn { border: none; background: transparent; color: var(--ink-soft); font-size: 15px; border-radius: 6px; padding: 5px 7px; line-height: 1; }
  .icon-btn:hover:not(:disabled) { background: var(--surface-2); color: var(--ink); }
  .icon-btn.active { color: var(--accent-strong); background: var(--accent-tint); }
  .ctrl-row { display: flex; align-items: center; gap: 2px; margin-bottom: 4px; }
  .mini-btn { border: none; background: transparent; color: var(--ink-soft); font-size: 11px; line-height: 1; padding: 2px 5px; border-radius: 4px; }
  .mini-btn:hover:not(:disabled) { background: var(--surface); color: var(--accent-strong); }
  .mini-btn:disabled { opacity: 0.3; }
  .mini-btn.confirm { background: var(--danger); color: #fff; }

  [contenteditable="true"]:hover { background: var(--surface-2); border-radius: 3px; }

  /* ---------- shell ---------- */
  #app { min-height: 100vh; display: flex; flex-direction: column; }
  .topbar {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 14px 22px; border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, var(--surface) 0%, var(--paper) 100%);
  }
  .topbar .titles { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .topbar h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; border-radius: 4px; padding: 1px 3px; margin-left: -3px; max-width: 46ch; overflow: hidden; text-overflow: ellipsis; }
  .topbar .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-left: auto; }
  .toolbar2 {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 9px 22px; border-bottom: 1px solid var(--line); background: var(--surface);
  }
  .status-pill {
    display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-strong);
    background: var(--surface); border-radius: 999px; padding: 4px 5px 4px 5px; font-size: 11.5px; font-weight: 600;
  }
  .status-pill select { border: none; background: transparent; color: inherit; font: inherit; font-weight: 600; cursor: pointer; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
  .star-btn { border: none; background: transparent; color: var(--line-strong); font-size: 17px; line-height: 1; padding: 2px 4px; border-radius: 6px; }
  .star-btn:hover { background: var(--surface-2); }
  .star-btn.on { color: var(--warm); }

  /* ---------- library ---------- */
  .library-main { padding: 22px 26px 60px; flex: 1; }
  .library-toolrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
  .search-input { border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 7px 11px; font-size: 12.5px; width: 220px; }
  .chip-toggle {
    border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-soft);
    border-radius: 999px; padding: 5px 12px; font-size: 11.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;
  }
  .chip-toggle.active { border-color: var(--accent); background: var(--accent-tint); color: var(--accent-strong); }
  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(258px, 1fr)); gap: 14px; }
  .bp-card {
    border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 14px 15px;
    display: flex; flex-direction: column; gap: 9px; cursor: pointer; transition: border-color 0.15s ease, transform 0.1s ease;
  }
  .bp-card:hover { border-color: var(--accent); }
  .bp-card .row-top { display: flex; align-items: center; justify-content: space-between; }
  .status-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; font-family: var(--font-tech); }
  .bp-card .title { font-weight: 700; font-size: 14.5px; text-wrap: balance; }
  .bp-card .meta { font-size: 11.5px; color: var(--ink-soft); font-family: var(--font-tech); }
  .bp-card .row-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 2px; }
  .empty-state { text-align: center; padding: 70px 20px; color: var(--ink-soft); }
  .empty-state h2 { color: var(--ink); font-size: 18px; margin: 0 0 6px; }
  .empty-state .actions { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }

  /* ---------- filter strip (editor + viewer) ---------- */
  .filter-strip { border-bottom: 1px solid var(--line); background: var(--surface-2); padding: 14px 22px; display: flex; flex-wrap: wrap; gap: 26px; }
  .filter-strip .group { display: flex; flex-direction: column; gap: 7px; }
  .filter-strip .group h3 { font-size: 10px; margin: 0; }
  .group-help { font-size: 10.5px; color: var(--ink-soft); margin: 2px 0 0; max-width: 230px; line-height: 1.35; }
  .profile-row, .chip-row, .lane-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .profile-chip { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 6px; padding: 6px 26px 6px 10px; font-size: 11.5px; text-align: left; cursor: pointer; position: relative; min-width: 96px; }
  .profile-chip strong { display: block; font-size: 12px; border-radius: 3px; }
  .profile-chip span { display: block; font-size: 10px; color: var(--ink-soft); }
  .profile-chip.active { border-color: var(--accent); background: var(--accent-tint); }
  .profile-chip .profile-rm { position: absolute; top: 2px; right: 2px; }
  .profile-chip.add-profile { border-style: dashed; background: transparent; font-weight: 600; color: var(--ink-soft); display: flex; align-items: center; padding: 6px 10px; }
  .profile-chip.add-profile:hover { color: var(--accent-strong); border-color: var(--accent); }
  .chip { border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-soft); border-radius: 999px; padding: 4px 11px; font-family: var(--font-tech); font-size: 11px; }
  .chip.selected { background: var(--warm-tint); border-color: var(--warm); color: var(--warm); font-weight: 600; }
  .lane-toggle { display: flex; align-items: center; gap: 6px; font-size: 12px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 9px; }
  .lane-toggle input { accent-color: var(--accent); }
  .empty-hint { font-size: 11.5px; color: var(--ink-soft); font-style: italic; }

  /* ---------- canvas ---------- */
  .canvas-scroll { overflow-x: auto; padding: 20px 24px 60px; flex: 1; }
  .canvas-grid { display: grid; border-top: 1px solid var(--line); border-left: 1px solid var(--line); min-width: max-content; }
  .lane-label, .stage-head, .cell { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .stage-head { background: var(--surface-2); padding: 10px 12px; position: sticky; top: 0; z-index: 2; }
  .stage-head .name { font-weight: 700; font-size: 13px; border-radius: 3px; }
  .col-resize-handle { position: absolute; top: 0; bottom: 0; right: -3px; width: 6px; cursor: col-resize; z-index: 3; background: transparent; }
  .col-resize-handle:hover, .col-resize-handle.active { background: var(--accent); opacity: 0.55; }
  .stage-head .remove { float: right; border: none; background: transparent; color: var(--ink-soft); font-size: 13px; line-height: 1; padding: 2px 4px; border-radius: 4px; }
  .stage-head .remove:hover { background: var(--danger); color: #fff; }
  .stage-head .remove.confirm { background: var(--danger); color: #fff; }
  .corner { background: var(--surface-2); position: sticky; left: 0; top: 0; z-index: 3; }
  .lane-label { background: var(--surface-2); position: sticky; left: 0; z-index: 1; padding: 10px 11px; display: flex; flex-direction: column; gap: 4px; justify-content: center; border-left: 3px solid var(--line-strong); }
  .lane-label .name { font-weight: 700; font-size: 12.5px; border-radius: 3px; }
  .lane-label .kind { font-family: var(--font-tech); font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); }
  .lane-label .remove-lane { align-self: flex-start; border: none; background: transparent; color: var(--ink-soft); font-size: 10.5px; text-decoration: underline; padding: 0; }
  .lane-label .remove-lane:hover { color: var(--danger); }
  .lane-label .remove-lane.confirm { color: var(--danger); font-weight: 700; }
  .cell { background: var(--surface); padding: 9px 11px; min-width: 200px; display: flex; flex-direction: column; gap: 6px; transition: opacity 0.15s ease; }
  .cell.dimmed { opacity: 0.32; }
  .cell .text { min-height: 34px; font-size: 12.8px; border-radius: 3px; }
  .cell .text:empty::before { content: attr(data-placeholder); color: var(--ink-soft); font-style: italic; }
  .tagrow { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag-input { font-family: var(--font-tech); font-size: 10.5px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-soft); border-radius: 999px; padding: 2px 8px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag-input:hover { color: var(--ink); border-color: var(--accent); }
  .cell-action-select { display: block; font-family: var(--font-tech); font-size: 10px; border: 1px dashed var(--line-strong); background: transparent; color: var(--ink-soft); border-radius: 999px; padding: 2px 8px; margin-top: 4px; max-width: 100%; }
  .cell-action-select:hover { border-color: var(--accent); color: var(--accent-strong); }
  .cell.highlighted { outline: 2px solid var(--highlight); background: var(--highlight-tint); }
  .tag-input.role { border-color: var(--accent); color: var(--accent-strong); background: var(--accent-tint); }
  .tag-input.channel { border-color: var(--warm); color: var(--warm); background: var(--warm-tint); }
  .divider-row { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 3px 12px; background: var(--paper); border-bottom: 1px dashed var(--line-strong); }
  .divider-row .line { flex: 1; height: 0; border-top: 1px dashed var(--line-strong); }
  .divider-row .label { font-family: var(--font-tech); font-size: 10px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-soft); white-space: nowrap; border-radius: 3px; padding: 1px 3px; }
  .add-stage-cell { display: flex; align-items: center; justify-content: center; min-width: 60px; background: var(--surface-2); }
  .add-stage-btn { border: 1px dashed var(--line-strong); background: transparent; color: var(--ink-soft); border-radius: 6px; width: 34px; height: 34px; font-size: 18px; }
  .add-stage-btn:hover { color: var(--accent); border-color: var(--accent); }
  .add-lane-row { display: flex; justify-content: flex-start; padding: 12px 24px 0; }
  .add-lane-btn { border: 1px dashed var(--line-strong); background: transparent; color: var(--ink-soft); border-radius: 6px; padding: 6px 12px; font-size: 11.5px; }
  .add-lane-btn:hover { color: var(--accent); border-color: var(--accent); }
  .stage-head.phase-merged { display: flex; flex-direction: column; gap: 6px; }
  .phase-merged-name { display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 700; font-size: 13px; text-align: center; }
  .phase-merged-name [contenteditable] { border-radius: 3px; }
  .phase-merged-name .mini-btn { color: inherit; opacity: 0.7; }
  .phase-merged-name .mini-btn:hover { opacity: 1; background: rgba(255,255,255,0.25); }
  .phase-merged-cols { display: grid; gap: 2px; border-top: 1px dashed currentColor; opacity: 0.9; padding-top: 4px; }
  .phase-merged-col { display: flex; align-items: center; justify-content: center; gap: 0; position: relative; }
  .phase-merged-col .mini-btn { color: inherit; opacity: 0.7; }
  .phase-merged-col .mini-btn:hover { opacity: 1; background: rgba(255,255,255,0.25); }
  .type-swatch { width: 16px; height: 16px; border-radius: 50%; border: 2px solid transparent; padding: 0; cursor: pointer; flex: none; }
  .type-swatch.active { border-color: var(--ink); }
  .color-swatch-row { display: flex; gap: 5px; margin-top: 7px; }
  .phase-select { display: block; font-family: var(--font-tech); font-size: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); border-radius: 999px; padding: 1px 4px; margin-top: 6px; max-width: 100%; }
  .divider-row .mini-btn { color: var(--ink-soft); }

  .evidence-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
  .evidence-pill { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--ink-soft); border-radius: 999px; padding: 2px 8px; font-size: 10px; font-family: var(--font-tech); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .evidence-pill img { width: 16px; height: 16px; object-fit: cover; border-radius: 3px; flex: none; }
  .evidence-pill.add { border-style: dashed; background: transparent; }
  .evidence-pill.add:hover { color: var(--accent-strong); border-color: var(--accent); }
  .evidence-pill.type-img { border-color: var(--accent); color: var(--accent-strong); background: var(--accent-tint); }
  .evidence-pill.type-oportunidade, .evidence-pill.type-solucao { border-color: var(--good); color: var(--good); background: var(--good-tint); }
  .evidence-pill.type-pain { border-color: var(--danger); color: var(--danger); background: var(--danger-tint); }
  .evidence-pill.type-metrica { border-color: var(--warm); color: var(--warm); background: var(--warm-tint); }

  .ref-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
  .ref-pill { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--accent); background: var(--accent-tint); color: var(--accent-strong); border-radius: 999px; padding: 2px 8px; font-size: 10px; font-family: var(--font-tech); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ref-pill.add { border-style: dashed; background: transparent; color: var(--ink-soft); border-color: var(--line-strong); }
  .ref-pill.add:hover { color: var(--accent-strong); border-color: var(--accent); }
  .cell-flash { animation: cellFlash 1.6s ease; }

  /* ---------- flowchart view ---------- */
  .cell.flow-node { position: relative; }
  .flow-handle { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); padding: 0; opacity: 0; transition: opacity 0.12s ease, transform 0.12s ease; z-index: 6; }
  .cell.flow-node:hover .flow-handle, .flow-handle:focus-visible { opacity: 1; }
  .flow-handle:hover { background: var(--accent); transform: scale(1.25); }
  .flow-handle.n { top: -7px; left: 50%; margin-left: -7px; cursor: crosshair; }
  .flow-handle.s { bottom: -7px; left: 50%; margin-left: -7px; cursor: crosshair; }
  .flow-handle.e { right: -7px; top: 50%; margin-top: -7px; cursor: crosshair; }
  .flow-handle.w { left: -7px; top: 50%; margin-top: -7px; cursor: crosshair; }
  .flow-svg { position: absolute; left: 0; top: 0; z-index: 4; pointer-events: none; }
  .flow-edge-path { fill: none; stroke: var(--accent); stroke-width: 2; pointer-events: none; }
  .flow-edge-hit { fill: none; stroke: transparent; stroke-width: 14; pointer-events: stroke; cursor: pointer; }
  .flow-edge-group:hover .flow-edge-path { stroke: var(--danger); stroke-width: 2.6; }
  @keyframes cellFlash { 0%, 100% { box-shadow: none; } 15%, 45% { box-shadow: inset 0 0 0 2px var(--accent); } }

  .chart-cell { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--surface); padding: 8px 12px; }
  .chart-wrap { display: flex; flex-direction: column; gap: 6px; }
  .chart-plot { position: relative; width: 100%; height: 64px; }
  .chart-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .chart-line { fill: none; stroke: var(--accent); stroke-width: 1.6; vector-effect: non-scaling-stroke; }
  .chart-zero-line { stroke: var(--line-strong); stroke-width: 1; stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; }
  .chart-dot-marker { position: absolute; width: 9px; height: 9px; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 0 2px var(--surface); }
  .chart-dot-marker.pos { background: var(--good); }
  .chart-dot-marker.neg { background: var(--danger); }
  .chart-dot-marker.neu { background: var(--ink-soft); }
  .chart-inputs { display: grid; gap: 4px; }
  .chart-score { font-family: var(--font-tech); font-size: 10.5px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-soft); border-radius: 4px; padding: 2px; text-align: center; }

  .viewer-banner { background: var(--accent-tint); color: var(--accent-strong); font-family: var(--font-tech); font-size: 11px; padding: 7px 22px; text-align: center; letter-spacing: 0.03em; }

  /* ---------- modal / toast ---------- */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(15, 30, 48, 0.45); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 50; }
  .modal { background: var(--surface); border-radius: 10px; border: 1px solid var(--line); width: min(640px, 100%); max-height: 84vh; overflow-y: auto; padding: 20px 22px 22px; }
  .modal h2 { margin: 0 0 4px; font-size: 17px; }
  .modal .modal-sub { font-size: 12px; color: var(--ink-soft); margin: 0 0 16px; }

        if (STATUS_ORDER.indexOf(s) !== -1) status = s;
        mode = null; return;
      }
      if (/^etapas:\s*$/i.test(line)) { mode = "etapas"; return; }
      if (/^fases:\s*$/i.test(line)) { mode = "fases"; return; }
      if ((m = /^camada:\s*(.+)$/i.exec(line))) { currentLane = m[1].trim(); lanes.push({ name: currentLane, kind: "content" }); cellsByLaneName[currentLane] = {}; mode = "camada"; return; }
      if ((m = /^grafico:\s*(.+)$/i.exec(line))) { currentLane = m[1].trim(); lanes.push({ name: currentLane, kind: "chart" }); cellsByLaneName[currentLane] = {}; mode = "grafico"; return; }
      if ((m = /^divisor:\s*(.+)$/i.exec(line))) { lanes.push({ name: m[1].trim(), kind: "divider" }); mode = null; return; }
      if (line.charAt(0) === "-") {

        if (mode === "etapas") { ensureStage(body); return; }
        if (mode === "fases") {
          var pm = /^([^:]+):\s*(.*)$/.exec(body);
          if (pm) phaseDefs.push({ name: pm[1].trim(), stageNames: pm[2].split(",").map(function (n) { return n.trim(); }).filter(Boolean) });
          return;
        }
        if (mode === "grafico" && currentLane) {
          var gm = /^([^:]+):\s*(.*)$/.exec(body);
          if (gm) {
            var gStageName = gm[1].trim();
            var gVal = parseInt(gm[2].trim(), 10);
            if (isNaN(gVal)) gVal = 0;
            gVal = Math.max(-2, Math.min(2, gVal));
            ensureStage(gStageName);

          }

        }

            extractAllTags(rest, "nota").forEach(function (v) { evidences.push({ id: uid("ev"), type: "nota", text: v }); });
            extractAllTags(rest, "oportunidade").forEach(function (v) { evidences.push({ id: uid("ev"), type: "oportunidade", text: v }); });
            extractAllTags(rest, "solucao").forEach(function (v) { evidences.push({ id: uid("ev"), type: "solucao", text: v }); });
            extractAllTags(rest, "pain").forEach(function (v) { evidences.push({ id: uid("ev"), type: "pain", text: v }); });
            extractAllTags(rest, "metrica").forEach(function (v) {

            });

          }

    if (lanes.length === 0) throw new Error('Nenhuma camada encontrada. Use "camada: Nome" seguido de linhas "- Etapa: texto".');
    if (stageOrder.length === 0) throw new Error('Nenhuma etapa encontrada. Use um bloco "etapas:" ou defina etapas dentro das camadas.');

    var stages = stageOrder.map(function (n) { return { id: uid("stage"), name: n }; });
    var stageIdByName = {}; stages.forEach(function (s) { stageIdByName[s.name] = s.id; });
    var laneObjs = lanes.map(function (l) { return { id: uid("lane"), key: uid("k"), name: l.name, kind: l.kind, side: "front" }; });

    laneObjs.forEach(function (laneObj, i) {
      if (lanes[i].kind === "divider") return;
      var laneCells = cellsByLaneName[lanes[i].name] || {};
      Object.keys(laneCells).forEach(function (stageName) {
        var sid = stageIdByName[stageName];

    });

    var phases = [];
    phaseDefs.forEach(function (pd) {

      var any = false;
      pd.stageNames.forEach(function (sn) {
        var sid = stageIdByName[sn];

    return { title: title, status: status, favorite: false, stages: stages, lanes: laneObjs, cells: cells, phases: phases, profiles: defaultProfilesForLanes(laneObjs), laneTypes: defaultLaneTypesForData() };
  }

  function serializeBlueprintSyntax(bp) {
    var lines = ["titulo: " + bp.title, "status: " + bp.status, "", "etapas:"];
    bp.stages.forEach(function (s) { lines.push("- " + s.name); });
    if (bp.phases && bp.phases.length) {
      lines.push("");
      lines.push("fases:");
      bp.phases.forEach(function (p) {
        var names = bp.stages.filter(function (s) { return s.phaseId === p.id; }).map(function (s) { return s.name; });
        if (names.length) lines.push("- " + p.name + ": " + names.join(", "));
      });
    }
    bp.lanes.forEach(function (lane) {
      lines.push("");
      if (lane.kind === "divider") { lines.push("divisor: " + lane.name); return; }
      if (lane.kind === "chart") {
        lines.push("grafico: " + lane.name);
        bp.stages.forEach(function (s) {
          var c = bp.cells[cellKey(lane.id, s.id)];
          if (c && typeof c.value === "number") lines.push("- " + s.name + ": " + c.value);
        });
        return;
      }
      lines.push("camada: " + lane.name);
      bp.stages.forEach(function (s) {
        var c = bp.cells[cellKey(lane.id, s.id)];
        if (!c || (!c.text && !c.role && !c.channel && !(c.evidences && c.evidences.length))) return;
        var tags = "";
        if (c.role) tags += " [papel: " + c.role + "]";
        if (c.channel) tags += " [canal: " + c.channel + "]";
        (c.evidences || []).forEach(function (ev) {
          if (ev.type === "metrica") tags += " [metrica: " + (ev.metricLabel || "") + "=" + (ev.metricValue || "") + "]";
          else if (ev.type !== "img" && ev.text) tags += " [" + ev.type + ": " + ev.text + "]";
        });
        lines.push("- " + s.name + ": " + (c.text || "") + tags);
      });
    });
    return lines.join("\n");
  }

  /* ================= flowchart overlay: draws reference lines between cells ================= */
  function attachFlowLines(grid, data, filters, editable, onEdit) {
    var SVG_NS = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(SVG_NS, "svg");
    svg.setAttribute("class", "flow-svg");
    var defs = document.createElementNS(SVG_NS, "defs");
    defs.innerHTML = '<marker id="flowArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--accent);"></path></marker>';
    svg.appendChild(defs);
    grid.style.position = "relative";
    grid.appendChild(svg);

    function edgePoint(rect, gridRect, dir) {
      if (dir === "l") return { x: rect.left - gridRect.left, y: rect.top - gridRect.top + rect.height / 2 };
      if (dir === "r") return { x: rect.right - gridRect.left, y: rect.top - gridRect.top + rect.height / 2 };
      if (dir === "t") return { x: rect.left - gridRect.left + rect.width / 2, y: rect.top - gridRect.top };
      return { x: rect.left - gridRect.left + rect.width / 2, y: rect.bottom - gridRect.top };
    }

    function redraw() {
      if (!document.body.contains(grid)) { ro.disconnect(); window.removeEventListener("resize", redraw); return; }
      if (filters.showReferences === false) { while (svg.lastChild !== defs) svg.removeChild(svg.lastChild); return; }
      var gridRect = grid.getBoundingClientRect();
      svg.setAttribute("width", grid.scrollWidth);
      svg.setAttribute("height", grid.scrollHeight);
      while (svg.lastChild !== defs) svg.removeChild(svg.lastChild);

      data.lanes.filter(function (l) { return l.kind === "content"; }).forEach(function (lane) {
        data.stages.forEach(function (stage) {
          var key = cellKey(lane.id, stage.id);
          var cd = data.cells[key];
          if (!cd || !(cd.references || []).length) return;
          var srcEl = grid.querySelector('[data-cell-key="' + key + '"]');
          if (!srcEl) return;
          var srcRect = srcEl.getBoundingClientRect();
          cd.references.forEach(function (r) {
            var dstEl = grid.querySelector('[data-cell-key="' + cellKey(r.laneId, r.stageId) + '"]');
            if (!dstEl) return;
            var dstRect = dstEl.getBoundingClientRect();
            var sCenter = { x: srcRect.left - gridRect.left + srcRect.width / 2, y: srcRect.top - gridRect.top + srcRect.height / 2 };
            var dCenter = { x: dstRect.left - gridRect.left + dstRect.width / 2, y: dstRect.top - gridRect.top + dstRect.height / 2 };
            var horizontal = Math.abs(dCenter.x - sCenter.x) >= Math.abs(dCenter.y - sCenter.y);
            var p1, p2;
            if (horizontal) {
              p1 = edgePoint(srcRect, gridRect, dCenter.x >= sCenter.x ? "r" : "l");
              p2 = edgePoint(dstRect, gridRect, dCenter.x >= sCenter.x ? "l" : "r");
            } else {
              p1 = edgePoint(srcRect, gridRect, dCenter.y >= sCenter.y ? "b" : "t");
              p2 = edgePoint(dstRect, gridRect, dCenter.y >= sCenter.y ? "t" : "b");
            }
            var dx = p2.x - p1.x, dy = p2.y - p1.y;
            var c1 = horizontal ? { x: p1.x + dx * 0.5, y: p1.y } : { x: p1.x, y: p1.y + dy * 0.5 };
            var c2 = horizontal ? { x: p2.x - dx * 0.5, y: p2.y } : { x: p2.x, y: p2.y - dy * 0.5 };
            var d = "M " + p1.x + " " + p1.y + " C " + c1.x + " " + c1.y + ", " + c2.x + " " + c2.y + ", " + p2.x + " " + p2.y;

            var g = document.createElementNS(SVG_NS, "g");
            var hit = document.createElementNS(SVG_NS, "path");
            hit.setAttribute("d", d); hit.setAttribute("class", "flow-edge-hit");
            var path = document.createElementNS(SVG_NS, "path");
            path.setAttribute("d", d); path.setAttribute("class", "flow-edge-path"); path.setAttribute("marker-end", "url(#flowArrow)");
            g.appendChild(hit); g.appendChild(path);
            if (editable) {
              g.setAttribute("class", "flow-edge-group");
              g.addEventListener("click", function () {
                openRemoveReferenceModal(data, lane.id, stage.id, r.id, function () { onEdit(); rerenderIfEditor(); redraw(); });
              });
            }
            svg.appendChild(g);
          });
        });
      });
    }

    var ro = new ResizeObserver(function () { redraw(); });
    ro.observe(grid);
    window.addEventListener("resize", redraw);
    setTimeout(redraw, 0);
    requestAnimationFrame(redraw);
  }

  function openTagModal(data, laneId, stageId, field, onSaved) {

  function cellRefOptionLabel(data, lane, stage) {

  function openReferenceModal(data, laneId, stageId, onSaved) {

    if (cell.references.length) {

      cell.references.forEach(function (r) {

  function openShareModal(bp) {

    var dlBtn = el("button", { class: "btn" }, [document.createTextNode("Baixar pÃ¡gina para compartilhar")]);

  function buildStandaloneViewerHtml(bp) {
    var portable = portableFromRecord(bp);
    var filtersSnapshot = { activeProfileId: APP.filters.activeProfileId, hiddenLanes: Array.from(APP.filters.hiddenLanes), roles: Array.from(APP.filters.roles), channels: Array.from(APP.filters.channels), showReferences: APP.filters.showReferences !== false, viewMode: APP.filters.viewMode === "flow" ? "flow" : "swimlane" };
    var styleText = document.querySelector("style").outerHTML;
    var appScript = document.getElementById("appScript").textContent;
    function safeJson(obj) { return JSON.stringify(obj).replace(/<\/script/gi, "<\\/script"); }
    var embed = "window.__EMBEDDED_BLUEPRINT__ = " + safeJson(portable) + ";\nwindow.__EMBEDDED_FILTERS__ = " + safeJson(filtersSnapshot) + ";\n";
    return "<!doctype html><html><head><meta charset=\"utf-8\"><title>" + escapeHtml(bp.title) + "</title>" + styleText + "</head><body>" +
      '<div id="app"></div><div id="modalRoot"></div><div class="toast" id="toast" role="status" aria-live="polite"></div>' +
      "<script>" + embed + appScript + "</" + "script>" +
      "</body></html>";
  }
  function downloadStandaloneViewer(bp) { offerDownload(slugify(bp.title) + "-visualizador.html", buildStandaloneViewerHtml(bp), "text/html"); }

  function extractEmbeddedBlueprintFromHtml(text) {
    var marker = "window.__EMBEDDED_BLUEPRINT__ = ";
    var idx = text.indexOf(marker);
    if (idx === -1) throw new Error('NÃ£o encontrei um blueprint incorporado neste HTML. Use o arquivo baixado em "Compartilhar â†’ Baixar pÃ¡gina para compartilhar" â€” o "Baixar HTML" do menu de exportaÃ§Ã£o Ã© sÃ³ uma imagem estÃ¡tica, sem dados para reimportar.');
    var rest = text.slice(idx + marker.length);
    var endMarker = ";\nwindow.__EMBEDDED_FILTERS__";
    var endIdx = rest.indexOf(endMarker);
    if (endIdx === -1) throw new Error("NÃ£o consegui reconhecer o formato deste arquivo HTML.");
    return JSON.parse(rest.slice(0, endIdx));
  }

  function openImportModal() {
    var wrap = el("div", {});
    wrap.appendChild(el("h2", { text: "Importar blueprint" }));
    wrap.appendChild(el("p", { class: "modal-sub", text: "Cole a sintaxe de blueprint (com etapas, fases, camadas, divisores, grÃ¡fico de emoÃ§Ã£o e evidÃªncias), um JSON ou HTML exportado desta ferramenta, ou peÃ§a a um assistente de IA para gerar o texto no formato abaixo." }));

    var tabs = el("div", { class: "tab-row" });
    var body = el("div", {});
    var tabDefs = [["syntax", "Texto / Sintaxe"], ["json", "JSON / HTML"], ["ai", "PDF / PPT / Imagem"]];
    tabDefs.forEach(function (t) {
      var b = el("button", { class: "tab-btn" + (APP.importTab === t[0] ? " active" : "") }, [document.createTextNode(t[1])]);

      tabs.appendChild(b);
    });
    wrap.appendChild(tabs); wrap.appendChild(body);
    renderTabBody();

    function renderTabBody() {
      body.innerHTML = "";
      if (APP.importTab === "syntax") {
        var ta = el("textarea", { class: "syntax-input", placeholder: "Cole aqui o texto no formato de sintaxe de blueprintâ€¦" });

        var copyEx = el("button", { class: "btn small ghost" }, [document.createTextNode("Copiar exemplo")]);
        copyEx.addEventListener("click", function () {
          if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(SYNTAX_EXAMPLE).then(function () { toast("Exemplo copiado"); }).catch(function () { ta.value = SYNTAX_EXAMPLE; });
          else ta.value = SYNTAX_EXAMPLE;
        });
        var importBtn = el("button", { class: "btn primary" }, [document.createTextNode("Importar")]);
        importBtn.addEventListener("click", function () {
          try {
            var portable = parseBlueprintSyntax(ta.value);
            var rec = wrapRecord(portable);
            importBtn.disabled = true;
            remoteInsert(rec).then(function () {
              APP.library.unshift(rec);
              closeModal(); openBlueprint(rec.id); toast("Blueprint importado");
            }).catch(function () { importBtn.disabled = false; });
          } catch (e) { err.textContent = e.message; }
        });
        body.appendChild(ta); body.appendChild(err);
        body.appendChild(el("div", { style: "display:flex;gap:8px;margin-top:8px;" }, [exBtn, copyEx]));
        body.appendChild(exBlock);
        body.appendChild(el("p", { class: "modal-sub", style: "margin-top:8px;margin-bottom:0;", text: "EvidÃªncias do tipo Imagem nÃ£o sÃ£o suportadas por texto â€” adicione-as depois, direto na cÃ©lula, dentro da ferramenta." }));
        body.appendChild(el("div", { class: "modal-footer" }, [importBtn]));
      } else if (APP.importTab === "json") {
        var fileInput = el("input", { type: "file", accept: ".json,.html,application/json,text/html" });
        var errJ = el("div", { class: "field-error" });
        fileInput.addEventListener("change", function () {
          var f = fileInput.files[0]; if (!f) return;
          var reader = new FileReader();
          reader.onload = function () {
            var obj, jsonErr;
            try { obj = JSON.parse(reader.result); }
            catch (e1) {
              jsonErr = e1;
              try { obj = extractEmbeddedBlueprintFromHtml(reader.result); }
              catch (e2) { errJ.textContent = e2.message; return; }
            }
            try {
              if (!obj.stages || !obj.lanes || !obj.cells) throw new Error("Arquivo invÃ¡lido: faltam stages/lanes/cells.");
              var rec = wrapRecord(obj);
              remoteInsert(rec).then(function () {
                APP.library.unshift(rec);
                closeModal(); openBlueprint(rec.id); toast("Blueprint importado");
              }).catch(function () {});
            } catch (e) { errJ.textContent = e.message; }
          };
          reader.readAsText(f);
        });
        body.appendChild(fileInput); body.appendChild(errJ);
        body.appendChild(el("p", { class: "modal-sub", style: "margin-top:8px;margin-bottom:0;", text: 'Aceita um .json baixado em "Baixar JSON" ou o .html baixado em "Compartilhar â†’ Baixar pÃ¡gina para compartilhar" (esse HTML carrega os dados completos do blueprint â€” o "Baixar HTML" do menu de exportaÃ§Ã£o Ã© sÃ³ uma imagem estÃ¡tica e nÃ£o pode ser reimportado).' }));
      } else {
        body.appendChild(el("div", { class: "disabled-note", text: "ImportaÃ§Ã£o com reconstruÃ§Ã£o por IA a partir de PDF, PowerPoint ou imagem nÃ£o Ã© possÃ­vel dentro desta ferramenta (artifact roda 100% no navegador, sem acesso a um serviÃ§o de IA ou de leitura de documentos). Isso requer o backend descrito no plano de stack (NestJS + gateway de IA)." }));
        body.appendChild(el("p", { class: "modal-sub", style: "margin-top:10px", text: "Alternativa hoje: peÃ§a a um assistente de IA para descrever o blueprint no formato de texto/sintaxe (aba anterior) e cole o resultado aqui." }));
      }
    }
    var closeModal = openModal(wrap);
  }

  if (window.__EMBEDDED_BLUEPRINT__) {
    var embeddedFilters = window.__EMBEDDED_FILTERS__ || { activeProfileId: null, hiddenLanes: [], roles: [], channels: [], showReferences: true, viewMode: "swimlane" };
    renderViewer({ bp: window.__EMBEDDED_BLUEPRINT__, f: embeddedFilters });
  } else {
    boot();
  }
})();
